<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>项目经理的浮生绘记</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
    />

    <style>
      /* 1. 修改侧边栏宽度，从默认的 300px 增加到 350px 或更多 */
      :root {
        --sidebar-width: 350px;
      }

      /* 2. 解决标题过长被截断的问题，允许文字自动换行 */
      .sidebar ul li a {
        white-space: normal !important; /* 允许换行 */
        line-height: 1.5; /* 增加行高，防止换行后文字太挤 */
        padding: 8px 15px; /* 稍微调整边距 */
        display: block;
      }

      /* 3. 增强视觉引导：悬停时显示完整背景 */
      .sidebar-nav li > a:hover {
        background-color: rgba(66, 185, 131, 0.1);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.$docsify = {
        name: "项目经理的浮生绘记",
        repo: "https://github.com/ShenWan0906/MyBlog", // 关联你的仓库
        loadSidebar: true,
        subMaxLevel: 3,
        auto2top: true,
        // 搜索插件配置
        search: {
          maxAge: 86400000, // 过期时间，单位毫秒，默认一天
          paths: "auto",
          placeholder: "搜索面试真题、交付实战、敏捷经验...",
          noData: "未找到相关文章，换个关键词试试？",
          depth: 6,
          hideOtherSidebarContent: false, // 是否隐藏侧边栏其他内容
        },
      };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  </body>
</html>

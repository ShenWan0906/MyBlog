<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>项目经理的浮生绘记</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
    />
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css"
    />

    <style>
      /* 1. 进一步增加侧边栏宽度 */
      :root {
        --sidebar-width: 450px;
      }

      /* 2. 搜索框美化 */
      .search {
        padding: 20px 20px 10px 20px !important;
        border-bottom: none !important;
      }

      .search input {
        border-radius: 24px !important;
        background: #f5f6f7 !important;
        border: 1px solid #e1e4e8 !important;
        padding: 12px 18px 12px 35px !important; /* 预留图标空间 */
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
        outline: none;
      }

      /* 搜索框激活状态 */
      .search input:focus {
        background: #fff !important;
        border-color: #42b983 !important;
        box-shadow: 0 4px 12px rgba(66, 185, 131, 0.15) !important;
        width: 95% !important;
      }

      /* 搜索结果面板优化 */
      .search .results-panel.show {
        padding: 10px !important;
        border-radius: 8px !important;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1) !important;
      }

      /* 3. 侧边栏长标题换行与间距优化 */
      .sidebar ul li a {
        white-space: normal !important; /* 强制换行 */
        line-height: 1.6 !important; /* 舒适的行高 */
        padding: 10px 20px !important; /* 点击区域加宽 */
        display: block;
        word-break: break-all; /* 确保长英文单词也能折行 */
        font-size: 14px;
        color: #454d5d;
      }

      /* 适配折叠插件的样式微调 */
      .sidebar-nav .folder {
        cursor: pointer;
        transition: all 0.3s;
      }

      /* 调整分类标题前的箭头间距 */
      .sidebar-nav li > p::after {
        margin-top: 12px !important;
      }

      /* 确保展开时的文字不会太挤 */
      .sidebar-nav ul li ul {
        padding-left: 20px !important;
        margin-top: 5px !important;
      }

      /* 4. 隐藏搜索框自带的清空按钮（可选，为了视觉更整洁） */
      .search .clear-button {
        right: 25px !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.$docsify = {
        name: "项目经理的浮生绘记",
        repo: "https://github.com/ShenWan0906/MyBlog", // 关联你的仓库
        loadSidebar: true,
        subMaxLevel: 3,
        auto2top: true,
        sidebarDisplayLevel: 1, // 设置默认展开级别。1 代表只显示分类名，不显示具体文章
        // 搜索插件配置
        search: {
          maxAge: 86400000,
          paths: "auto",
          placeholder: "搜索...",
          noData: "未找到",
          // 将 depth 从 6 改为 2，只索引大标题，大幅降低计算量
          depth: 2,
          // 开启这个选项，可以避免在侧边栏渲染过多无关紧要的搜索结果
          hideOtherSidebarContent: true,
          // 增加路径跨度
          namespace: "my-blog",
        },
      };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  </body>
</html>
